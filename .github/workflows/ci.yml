name: Rust quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release -p oblivion-store million_operation_oracle -- --ignored --exact
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r research/requirements.lock
      - run: cargo build --locked --release -p oblivion-sse -p oblivion-batcher -p oblivion-store -p oblivion-pir --examples
      - run: python -m unittest discover -s research/tests
        env:
          OBLIVION_PRESENCE_BINARY: target/release/examples/presence
