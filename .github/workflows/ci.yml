name: Rust quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Each process fixture uses real class deadlines. Run correctness fixtures
      # separately; offered-load contention is measured by dedicated campaigns.
      - run: cargo test --locked --workspace -- --test-threads=1
  stress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release -p oblivion-store million_operation_oracle -- --ignored --exact
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r research/requirements.lock
      - run: cargo build --locked --release --workspace --bins --examples
      - run: cargo fmt --manifest-path research/oram_reference/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path research/oram_reference/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path research/oram_reference/Cargo.toml -- --test-threads=1
      - run: cargo build --locked --release --manifest-path research/oram_reference/Cargo.toml
      - run: python -m unittest discover -s research/tests
        env:
          PRESENCE_BINARY: target/release/examples/presence
          EXECUTOR_RESOURCES_BINARY: target/release/examples/resource_measure
          EXEC_TIMING_BINARY: target/release/examples/timing_measure
          EPOCH_SYSTEM_BINARY: target/release/oblivion-server
